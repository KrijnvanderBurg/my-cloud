name: OpenTofu Destroy (OVH)

on:
  workflow_call:
    inputs:
      working_directory:
        description: Path to the OpenTofu configuration directory
        required: true
        type: string
      artifact_name:
        description: Name for artifacts and display
        required: true
        type: string
      state_key:
        description: State file key for the S3 backend configuration
        required: true
        type: string
      environment:
        description: GitHub environment for deployments (dev, prod)
        required: true
        type: string
      project_id:
        description: OVHcloud Public Cloud project ID for this environment
        required: true
        type: string
      ovh_endpoint:
        description: OVH API endpoint
        required: false
        type: string
        default: "ovh-eu"
      ovh_application_key:
        description: OVH API application key
        required: false
        type: string
        default: "54b46d19bfcee5ed"

permissions:
  contents: read
  pull-requests: write

env:
  OVH_ENDPOINT: ${{ inputs.ovh_endpoint }}
  OVH_APPLICATION_KEY: ${{ inputs.ovh_application_key }}
  OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
  OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.OVH_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.OVH_S3_SECRET_ACCESS_KEY }}
  TF_VAR_project_id: ${{ inputs.project_id }}
  DESTROY_OUTPUT_FILENAME: destroy-output.txt

jobs:
  destroy:
    name: Destroy ${{ inputs.artifact_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OpenTofu
        uses: ./.github/actions/opentofu-install

      - name: OpenTofu init
        uses: ./.github/actions/opentofu-init-ovh
        with:
          working_directory: ${{ inputs.working_directory }}
          state_key: ${{ inputs.state_key }}

      - name: OpenTofu destroy
        id: destroy
        uses: ./.github/actions/opentofu-destroy
        with:
          working_directory: ${{ inputs.working_directory }}
