name: OpenTofu Destroy

on:
  workflow_call:
    inputs:
      working_directory:
        description: Path to the OpenTofu configuration directory
        required: true
        type: string
      artifact_name:
        description: Name for artifacts and display
        required: true
        type: string
      client_id:
        description: Azure AD application client ID for OIDC authentication
        required: true
        type: string
      environment:
        description: GitHub environment for deployments (dev, prod)
        required: true
        type: string
      tenant_id:
        description: Azure AD tenant ID
        required: false
        type: string
        default: "90d27970-b92c-43dc-9935-1ed557d8e20e"

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  ARM_CLIENT_ID: ${{ inputs.client_id }}
  ARM_TENANT_ID: ${{ inputs.tenant_id }}
  ARM_USE_OIDC: true
  ARM_STORAGE_USE_AZUREAD: true
  PLAN_BINARY_FILENAME: tfplan
  PLAN_TEXT_FILENAME: tfplan.txt
  DESTROY_OUTPUT_FILENAME: destroy-output.txt

jobs:
  destroy:
    name: Destroy ${{ inputs.artifact_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.client_id }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install OpenTofu
        uses: ./.github/actions/opentofu-install

      - name: OpenTofu init
        uses: ./.github/actions/opentofu-init
        with:
          working_directory: ${{ inputs.working_directory }}

      - name: OpenTofu destroy plan
        id: plan
        uses: ./.github/actions/opentofu-destroy-plan
        with:
          working_directory: ${{ inputs.working_directory }}
          plan_binary_file: ${{ runner.temp }}/destroy-${{ inputs.artifact_name }}-${{ env.PLAN_BINARY_FILENAME }}
          plan_text_file: ${{ runner.temp }}/destroy-${{ inputs.artifact_name }}-${{ env.PLAN_TEXT_FILENAME }}

      - name: Post Destroy Plan to PR
        if: github.event_name == 'pull_request' && steps.plan.outputs.has_changes == 'true'
        uses: ./.github/actions/opentofu-plan-comment
        with:
          plan_text_file: ${{ steps.plan.outputs.plan_text_file }}
          environment: ${{ inputs.environment }}
          working_directory: ${{ inputs.working_directory }}

      - name: OpenTofu destroy
        id: destroy
        uses: ./.github/actions/opentofu-apply
        with:
          working_directory: ${{ inputs.working_directory }}
          plan_binary_file: ${{ steps.plan.outputs.plan_binary_file }}
          apply_output_file: ${{ runner.temp }}/destroy-${{ inputs.artifact_name }}-${{ env.DESTROY_OUTPUT_FILENAME }}

      - name: Post Destroy Result to PR
        if: always() && github.event_name == 'pull_request' && steps.plan.outputs.has_changes == 'true'
        uses: ./.github/actions/opentofu-apply-comment
        with:
          apply_output_file: ${{ steps.destroy.outputs.apply_output_file }}
          environment: ${{ inputs.artifact_name }}
          working_directory: ${{ inputs.working_directory }}
          apply_status: ${{ steps.destroy.outcome }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
